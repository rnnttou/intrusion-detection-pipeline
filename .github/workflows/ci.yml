name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:   # pour tests/test_db.py (ignoré en local si Postgres est éteint)
        image: postgres:16
        env:
          POSTGRES_USER: ids
          POSTGRES_PASSWORD: ids
          POSTGRES_DB: ids
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ids"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
